apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpulens.fullname" . }}
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # The data volume is ReadWriteOnce: never run two pods against it.
    type: Recreate
  selector:
    matchLabels:
      {{- include "gpulens.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpulens.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gpulens.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.sources.kubernetes }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gpulens
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:8080
            - -mode={{ .Values.mode }}
            - -fixtures-dir=/app/fixtures
            - -static-dir=/app/web/dist
            - -state-file=/app/data/gpulens-state.json
            - -live-state-file=/app/data/live-state.json
            - -live-interval={{ .Values.liveInterval }}
            {{- if .Values.audit.enabled }}
            - -audit-log-file=/app/data/audit.jsonl
            {{- end }}
            {{- if not .Values.sources.nvidiaSmi }}
            - -no-nvidia-smi
            {{- end }}
            {{- if not .Values.sources.amdSmi }}
            - -no-amd-smi
            {{- end }}
            {{- if not .Values.sources.hostVitals }}
            - -no-host-vitals
            {{- end }}
            {{- if .Values.allowRemoteConfig }}
            - -live-allow-remote-config
            {{- end }}
            {{- range .Values.fleet.peers }}
            - -peer={{ .name }}={{ .url }}
            {{- end }}
            {{- if .Values.fleet.peers }}
            - -fleet-interval={{ .Values.fleet.interval }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.clusterName }}
            - name: GPULENS_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            {{- end }}
            {{- if .Values.sources.dcgmExporterUrl }}
            - name: GPULENS_DCGM_EXPORTER_URL
              value: {{ .Values.sources.dcgmExporterUrl | quote }}
            {{- end }}
            {{- if .Values.sources.prometheusUrl }}
            - name: GPULENS_PROMETHEUS_URL
              value: {{ .Values.sources.prometheusUrl | quote }}
            {{- end }}
            {{- if .Values.sources.prometheusTokenSecret.name }}
            - name: GPULENS_PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sources.prometheusTokenSecret.name }}
                  key: {{ .Values.sources.prometheusTokenSecret.key }}
            {{- end }}
            {{- if not .Values.sources.kubernetes }}
            - name: GPULENS_KUBERNETES
              value: "false"
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: GPULENS_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.authSecret" . }}, key: admin-user}
            - name: GPULENS_BASIC_AUTH_PASS
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.authSecret" . }}, key: admin-password}
            {{- if or .Values.auth.viewerUser .Values.auth.existingSecret }}
            - name: GPULENS_VIEWER_USER
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.authSecret" . }}, key: viewer-user, optional: true}
            - name: GPULENS_VIEWER_PASS
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.authSecret" . }}, key: viewer-password, optional: true}
            {{- end }}
            {{- end }}
            {{- if include "gpulens.alertsOn" . }}
            - name: GPULENS_ALERT_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.alertSecret" . }}, key: slack-webhook-url, optional: true}
            - name: GPULENS_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.alertSecret" . }}, key: webhook-url, optional: true}
            - name: GPULENS_ALERT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: {{ include "gpulens.alertSecret" . }}, key: webhook-secret, optional: true}
            - name: GPULENS_ALERT_MIN_SEVERITY
              value: {{ .Values.alerts.minSeverity | quote }}
            {{- end }}
            {{- if .Values.alerts.publicUrl }}
            - name: GPULENS_PUBLIC_URL
              value: {{ .Values.alerts.publicUrl | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gpulens.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

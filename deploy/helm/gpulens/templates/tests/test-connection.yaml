apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gpulens.fullname" . }}-test"
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: healthz
      image: busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "gpulens.fullname" . }}:{{ .Values.service.port }}/healthz"]

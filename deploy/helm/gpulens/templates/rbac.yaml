{{- if and .Values.rbac.create .Values.sources.kubernetes }}
# Read-only: get/list/watch on nodes, pods and events. No secrets, configmaps, logs or exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpulens.fullname" . }}-readonly
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpulens.fullname" . }}-readonly
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpulens.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "gpulens.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gpulens.fullname" . }}
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gpulens.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.auth.enabled }}
      basicAuth:
        username:
          name: {{ include "gpulens.authSecret" . }}
          key: admin-user
        password:
          name: {{ include "gpulens.authSecret" . }}
          key: admin-password
      {{- end }}
{{- end }}

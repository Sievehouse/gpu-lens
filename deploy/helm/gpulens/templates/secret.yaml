{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if lt (len .Values.auth.adminPassword) 8 }}
{{- fail "auth.enabled=true needs auth.adminPassword (at least 8 characters) or auth.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpulens.authSecret" . }}
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.auth.adminUser | quote }}
  admin-password: {{ .Values.auth.adminPassword | quote }}
  {{- if .Values.auth.viewerUser }}
  viewer-user: {{ .Values.auth.viewerUser | quote }}
  viewer-password: {{ required "auth.viewerPassword is required when auth.viewerUser is set" .Values.auth.viewerPassword | quote }}
  {{- end }}
{{- end }}
{{- if and (include "gpulens.alertsOn" .) (not .Values.alerts.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpulens.alertSecret" . }}
  labels:
    {{- include "gpulens.labels" . | nindent 4 }}
type: Opaque
stringData:
  slack-webhook-url: {{ .Values.alerts.slackWebhookUrl | quote }}
  webhook-url: {{ .Values.alerts.webhookUrl | quote }}
  webhook-secret: {{ .Values.alerts.webhookSecret | quote }}
{{- end }}

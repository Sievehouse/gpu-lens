# Minimum Read-Only Kubernetes RBAC Manifest for GPU Lens
# Grants strictly read-only verbs (get, list, watch) on nodes, pods, and events.
# Zero access to secrets, configmaps, pods/exec, pods/log, or mutating verbs.
#
# Go Live (the live console) needs exactly this and nothing more. Create a token for the service account and pass it by file:
#   kubectl -n gpu-lens create token gpulens-reader --duration=24h > /run/secrets/k8s_token
#   gpulens -kubernetes-url https://<api-server> -kubernetes-token-file /run/secrets/k8s_token -kubernetes-ca-file /run/secrets/k8s_ca.crt
# Running inside the cluster under this service account needs no flags: the in-cluster token and CA are detected.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-lens
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpulens-reader
  namespace: gpu-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpulens-readonly-clusterrole
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpulens-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpulens-readonly-clusterrole
subjects:
  - kind: ServiceAccount
    name: gpulens-reader
    namespace: gpu-lens
